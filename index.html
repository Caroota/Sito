<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>caroota — cooking soon</title>
<meta name="description" content="caroota — process e advanced data analytics per le aziende. Cooking soon.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBF5EC">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#4A331F">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 145"><g transform="rotate(-6 50 75)"><rect x="35" y="20" width="10" height="15" rx="5" fill="%234FA365"/><rect x="45.5" y="11" width="10" height="24" rx="5" fill="%233E9455"/><rect x="56" y="3" width="10" height="32" rx="5" fill="%232F8547"/><path d="M31 44 Q31 35 40 35 L60 35 Q69 35 69 44 C69 66 57 95 51.5 106 Q50 109 48.5 106 C43 95 31 66 31 44 Z" fill="%23EE7A33"/><path d="M50 107 L39 118 M50 107 L61 116" stroke="%23B08D5F" stroke-width="5" stroke-linecap="round"/></g></svg>'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600&family=Space+Grotesk:wght@400;500&display=swap">
<style>
  :root {
    --bg: #FBF5EC;
    --wm: #4A331F;
    --root: #EE7A33;
    --claim: #6B5B49;
    --oo: #EE7A33;
    --motto: #4A3B2C;
    --sub: #8C7A67;
    --pill: #EE7A33;
    --pill-hover: #D9601C;
    --foot: #C4B3A2;
    --v1: #4FA365;
    --v2: #3E9455;
    --v3: #2F8547;
    --corpo: #EE7A33;
    --ridge: #D9601C;
    --rad: #B08D5F;
    --nodo: #EE7A33;
    --ico-luna: inline;
    --ico-sole: none;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #4A331F;
      --wm: #FBF1E2;
      --root: #F98B45;
      --claim: #E0CCB1;
      --oo: #F98B45;
      --motto: #F5E9D7;
      --sub: #CDB699;
      --pill: #EE7A33;
      --pill-hover: #F98B45;
      --foot: #9C8266;
      --v1: #63BD7C;
      --v2: #52AD6A;
      --v3: #419C58;
      --corpo: #F98B45;
      --ridge: #D9601C;
      --rad: #B08D5F;
      --nodo: #FBE7B8;
      --ico-luna: none;
      --ico-sole: inline;
    }
  }
  :root[data-theme="dark"] {
    --bg: #4A331F;
      --wm: #FBF1E2;
      --root: #F98B45;
      --claim: #E0CCB1;
      --oo: #F98B45;
      --motto: #F5E9D7;
      --sub: #CDB699;
      --pill: #EE7A33;
      --pill-hover: #F98B45;
      --foot: #9C8266;
      --v1: #63BD7C;
      --v2: #52AD6A;
      --v3: #419C58;
      --corpo: #F98B45;
      --ridge: #D9601C;
      --rad: #B08D5F;
      --nodo: #FBE7B8;
      --ico-luna: none;
      --ico-sole: inline;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--wm);
    font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 48px 24px;
    text-align: center;
  }
  .logo { width: 132px; height: auto; }
  .logo .b1 { fill: var(--v1); }
  .logo .b2 { fill: var(--v2); }
  .logo .b3 { fill: var(--v3); }
  .logo .corpo { fill: var(--corpo); }
  .logo .righe { stroke: var(--ridge); }
  .logo .radici path { stroke: var(--rad); }
  .logo .radici circle { fill: var(--nodo); }
  .bar { transform-box: fill-box; transform-origin: bottom center; animation: grow 0.7s cubic-bezier(0.34, 1.4, 0.64, 1) backwards; }
  .bar2 { animation-delay: 0.18s; }
  .bar3 { animation-delay: 0.36s; }
  .r { stroke-dasharray: 22; stroke-dashoffset: 22; animation: crescita 0.45s ease-out forwards; }
  .rb { stroke-dasharray: 16; stroke-dashoffset: 16; animation-duration: 0.35s; }
  .r1 { animation-delay: 0.9s; } .r2 { animation-delay: 1.0s; } .r3 { animation-delay: 1.1s; }
  .rb1 { animation-delay: 1.35s; } .rb2 { animation-delay: 1.42s; } .rb3 { animation-delay: 1.55s; }
  .nodo { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: sboccia 0.35s cubic-bezier(0.34, 1.5, 0.64, 1) forwards; }
  .n2 { animation-delay: 1.45s; } .n1 { animation-delay: 1.7s; } .n3 { animation-delay: 1.77s; } .n4 { animation-delay: 1.9s; }
  @keyframes crescita { to { stroke-dashoffset: 0; } }
  @keyframes sboccia { to { transform: scale(1); } }
  @keyframes grow { from { transform: scaleY(0); } }
  @media (prefers-reduced-motion: reduce) { .bar, .r, .nodo { animation: none; } .r { stroke-dashoffset: 0; } .nodo { transform: scale(1); } }
  h1 {
    margin: 0;
    font-family: 'Baloo 2', 'Arial Rounded MT Bold', system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(56px, 12vw, 92px);
    line-height: 1;
    letter-spacing: 0.01em;
    color: var(--wm);
  }
  h1 .root { color: var(--root); }
  .claim {
    font-weight: 500;
    font-size: clamp(20px, 4.5vw, 27px);
    letter-spacing: 0.04em;
    color: var(--claim);
  }
  .claim .oo { color: var(--oo); }
  p.motto {
    margin: 0;
    font-weight: 500;
    font-size: clamp(21px, 4vw, 26px);
    line-height: 1.4;
    color: var(--motto);
  }
  p.sub {
    margin: 0;
    max-width: 640px;
    font-size: 17px;
    line-height: 1.6;
    color: var(--sub);
  }
  a.mail {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--pill);
    color: #FFFFFF;
    text-decoration: none;
    font-weight: 500;
    font-size: 16px;
    padding: 13px 26px;
    border-radius: 999px;
    margin-top: 4px;
    transition: background 0.2s ease;
  }
  a.mail:hover { background: var(--pill-hover); }
  footer { font-size: 12px; color: var(--foot); margin-top: 16px; }
  .tema {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    right: max(16px, env(safe-area-inset-right));
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1.5px solid var(--foot);
    background: transparent;
    color: var(--claim);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
    transition: border-color 0.2s ease;
    z-index: 10;
  }
  .tema:hover { border-color: var(--sub); }
  .tema svg { width: 20px; height: 20px; }
  .tema .luna { display: var(--ico-luna); }
  .tema .sole { display: var(--ico-sole); }
</style>
</head>
<body>
  <button class="tema" type="button" aria-label="Cambia tema chiaro/scuro">
    <svg class="luna" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.5 13.2A8.2 8.2 0 1 1 10.8 3.5a6.6 6.6 0 0 0 9.7 9.7Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <svg class="sole" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5V5 M12 19v2.5 M2.5 12H5 M19 12h2.5 M5.3 5.3l1.8 1.8 M16.9 16.9l1.8 1.8 M18.7 5.3l-1.8 1.8 M7.1 16.9l-1.8 1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
  <svg class="logo" viewBox="0 0 100 145" fill="none" aria-hidden="true">
    <g transform="rotate(-6 50 75)">
      <rect class="bar b1" x="35" y="20" width="7" height="15" rx="3.5"/>
      <rect class="bar bar2 b2" x="45.5" y="11" width="7" height="24" rx="3.5"/>
      <rect class="bar bar3 b3" x="56" y="3" width="7" height="32" rx="3.5"/>
      <path class="corpo" d="M31 44 Q31 35 40 35 L60 35 Q69 35 69 44 C69 66 57 95 51.5 106 Q50 109 48.5 106 C43 95 31 66 31 44 Z"/>
      <path class="righe" d="M40 54 L56 54" stroke-width="3" stroke-linecap="round"/>
      <path class="righe" d="M43 68 L53 68" stroke-width="3" stroke-linecap="round"/>
      <g class="radici">
        <path class="r rm r1" d="M50 107 L36 120" stroke-width="2.5" stroke-linecap="round"/>
        <path class="r rm r2" d="M50 107 L50 122" stroke-width="2.5" stroke-linecap="round"/>
        <path class="r rm r3" d="M50 107 L64 118" stroke-width="2.5" stroke-linecap="round"/>
        <path class="r rb rb1" d="M36 120 L28 132" stroke-width="2" stroke-linecap="round"/>
        <path class="r rb rb2" d="M36 120 L43 133" stroke-width="2" stroke-linecap="round"/>
        <path class="r rb rb3" d="M64 118 L73 129" stroke-width="2" stroke-linecap="round"/>
        <circle class="nodo n2" cx="50" cy="122" r="2.7"/>
        <circle class="nodo n1" cx="28" cy="132" r="3.4"/>
        <circle class="nodo n3" cx="43" cy="133" r="2.9"/>
        <circle class="nodo n4" cx="73" cy="129" r="3.1"/>
      </g>
    </g>
  </svg>
  <h1>ca<span class="root">root</span>a</h1>
  <div class="claim">C<span class="oo">oo</span>king soon.</div>
  <p class="motto">Andiamo alla radice.<br>Il raccolto &egrave; vicino.</p>
  <p class="sub">Process e advanced data analytics per le aziende.</p>
  <a class="mail" href="mailto:ciao@caroota.it">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 6.5 L12 13 L21 6.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="5" width="18" height="14" rx="3" stroke="#FFFFFF" stroke-width="2"/></svg>
    ciao@caroota.it
  </a>
  <footer>&copy; 2026 caroota</footer>
<script>
(function () {
  var root = document.documentElement;
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  try {
    var salvato = localStorage.getItem('caroota-tema');
    if (salvato === 'dark' || salvato === 'light') root.setAttribute('data-theme', salvato);
  } catch (e) {}
  function attivo() {
    return root.getAttribute('data-theme') || (mq.matches ? 'dark' : 'light');
  }
  function metas(t) {
    var c = t === 'dark' ? '#4A331F' : '#FBF5EC';
    var ms = document.querySelectorAll('meta[name="theme-color"]');
    for (var i = 0; i < ms.length; i++) ms[i].setAttribute('content', c);
  }
  document.querySelector('.tema').addEventListener('click', function () {
    var prossimo = attivo() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', prossimo);
    try { localStorage.setItem('caroota-tema', prossimo); } catch (e) {}
    metas(prossimo);
  });
  if (root.getAttribute('data-theme')) metas(attivo());
})();
</script>
</body>
</html>
